<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartSustain India — Facility Intelligence Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- Top Navigation Bar -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-30 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="h-10 w-10 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-bold text-xl">
        <i class="fa-solid fa-leaf"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-lg font-bold text-white tracking-wide">SmartSustain AI</h1>
          <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">BPUT Hackathon Edition</span>
        </div>
        <p class="text-xs text-slate-400">Institutional Decision-Support Platform</p>
      </div>
    </div>

    <!-- Controls: Campus Selector & Role Toggle -->
    <div class="flex flex-wrap items-center gap-3">
      <div class="flex items-center gap-2 bg-slate-900 border border-slate-700/80 rounded-lg px-3 py-1.5 text-xs">
        <i class="fa-solid fa-building text-slate-400"></i>
        <label for="facilitySelect" class="text-slate-400">Facility:</label>
        <select id="facilitySelect" class="bg-transparent text-slate-200 outline-none cursor-pointer font-medium" onchange="updateFacility()">
          <option value="bput" class="bg-slate-900">BPUT Campus, Rourkela</option>
          <option value="hospital" class="bg-slate-900">SCB Government Hospital, Cuttack</option>
          <option value="industrial" class="bg-slate-900">IDCO Industrial Estate, Bhubaneswar</option>
        </select>
      </div>

      <div class="flex items-center bg-slate-900 border border-slate-700/80 rounded-lg p-1 text-xs">
        <button id="roleAdmin" onclick="setRole('Admin')" class="px-2.5 py-1 rounded bg-emerald-600 text-white font-medium transition">Administrator</button>
        <button id="roleOps" onclick="setRole('Operations')" class="px-2.5 py-1 rounded text-slate-400 hover:text-slate-200 transition">Operations</button>
        <button id="roleSust" onclick="setRole('Sustainability')" class="px-2.5 py-1 rounded text-slate-400 hover:text-slate-200 transition">Sustainability</button>
      </div>

      <div class="flex items-center gap-2 text-xs text-emerald-400 bg-emerald-950/40 border border-emerald-700/40 px-3 py-1.5 rounded-lg">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
        </span>
        IoT Ingestion Live
      </div>
    </div>
  </header>

  <!-- Main Body Content -->
  <main class="max-w-7xl mx-auto p-6 space-y-6">

    <!-- KPI Metric Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      
      <!-- AQI Card -->
      <div class="bg-slate-800/60 border border-slate-700/70 p-5 rounded-2xl hover:border-slate-600 transition shadow-lg">
        <div class="flex items-center justify-between text-xs text-slate-400 mb-2">
          <span>Air Quality Index (AQI)</span>
          <i class="fa-solid fa-wind text-amber-400 text-sm"></i>
        </div>
        <div class="flex items-baseline gap-2">
          <span id="kpiAqi" class="text-3xl font-extrabold text-amber-400">148</span>
